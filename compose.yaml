services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stowup
      POSTGRES_USER: stowup
      POSTGRES_PASSWORD: stowup
    ports:
      - "5432:5432"
    volumes:
      - stowup_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stowup"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stowup_postgres:
