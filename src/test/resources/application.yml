spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:stowup-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
stowup:
  master:
    enabled: false
  jwt:
    issuer: stowup-test
    secret: stowup-test-secret-with-at-least-thirty-two-characters
    expiration-hours: 1
  data:
    encryption-key: stowup-test-data-key-with-at-least-thirty-two-characters
  uploads:
    directory: ./target/test-uploads
