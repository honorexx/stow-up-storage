<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StowUp Atendimento</title><link rel="stylesheet" href="/staff/staff.css"></head>
<body>
  <main id="login" class="login-shell">
    <section class="login-card"><div class="mark">S<span>U</span></div><p class="eyebrow">AMBIENTE RESTRITO</p><h1>Atendimento StowUp</h1><p class="muted">Acesso exclusivo para profissionais autorizados.</p><form id="login-form"><label>E-mail corporativo<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="error"></p><button>Entrar no painel</button></form><small>Clientes usam o aplicativo StowUp. Não existe cadastro de funcionário nesta página.</small></section>
  </main>
  <main id="workspace" class="workspace hidden">
    <header><div class="brand"><div class="mark small">S<span>U</span></div><div><strong>StowUp Atendimento</strong><small id="agent"></small></div></div><div class="header-actions"><select id="status-filter"><option value="ALL">Todos</option><option value="OPEN">Em aberto</option><option value="CLOSED">Encerrados</option></select><button id="logout" class="ghost">Sair</button></div></header>
    <div class="layout"><aside><div class="queue-head"><div><p class="eyebrow">FILA</p><h2>Atendimentos</h2></div><button id="refresh" class="icon">↻</button></div><div id="queue" class="queue"></div></aside><section id="empty" class="empty"><div>◌</div><h2>Selecione um atendimento</h2><p>As mensagens do cliente aparecerão aqui.</p></section><section id="chat" class="chat hidden"><div class="chat-head"><div><h2 id="customer-name"></h2><p id="customer-email"></p></div><button id="toggle-status" class="outline"></button></div><div id="messages" class="messages"></div><form id="reply-form" class="composer"><textarea id="reply" maxlength="2000" placeholder="Escreva uma resposta clara e objetiva" required></textarea><button>Enviar resposta</button></form></section></div>
  </main><script src="/staff/staff.js"></script>
</body></html>
